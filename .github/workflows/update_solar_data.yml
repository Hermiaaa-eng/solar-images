name: 每日更新太阳活动数据

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-solar-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行数据抓取
        run: python fetch_space_weather.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add solar_miniprogram/daily_solar.json
          if git diff --staged --quiet; then
            echo "无数据变化"
          else
            git commit -m "每日更新太阳数据 $(date -u '+%Y-%m-%d')"
            git pull --rebase
            git push
          fi

